name: Build APK

on:
  push:
    paths-ignore: ['agent-chat/**', '**.md']
  pull_request:
    paths-ignore: ['agent-chat/**', '**.md']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew test
      - name: Assemble APK
        run: ./gradlew :app:assembleRelease
      - name: Check the packaged APK
        run: |
          tools/check-apk.sh app/build/outputs/apk/release/app-release.apk
          tools/audio-test/check-apk.sh app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          # The short commit hash tells testers which build they have.
          name: modulai-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
